server {
    listen 80;
    server_name localhost;

    # Перенаправляем весь HTTP-трафик на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;

    # Указываем пути к сертификатам
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Отключаем проверку Strict MIME типов
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Маршруты для фронтенда (SPA) ---
    location / {
        proxy_pass http://frontend:80; # Обращаемся к нашему фронтенд-контейнеру
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Маршруты для API бэкенда ---
    location /api/ {
        proxy_pass http://backend:5000; # Обращаемся к нашему бэкенд-контейнеру
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}