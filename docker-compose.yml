services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: armwrestling
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads   # если нужно сохранять загруженные файлы
      - ./backend/exports:/app/exports   # если нужно сохранять экспортированные протоколы

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"   # доступ на localhost:3000
    # volumes:       # для разработки можно расскомментировать, но в production использовать образ
    #   - ./frontend/src:/app/src
    #   - ./frontend/public:/app/public

volumes:
  postgres_data: